<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title data-i18n="chrome.documentTitle">PSERS Portfolio - Interactive Presentation</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="js/vendor/apexcharts.css">
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div class="slideWrap" id="slideWrap" tabindex="0" data-i18n-aria="chrome.slideAria">
      <div class="slideHtmlCanvas" id="slideHtmlCanvas"></div>
    </div>
  </div>
  <div id="navrow" data-i18n-aria="chrome.nav">
    <div class="navCluster">
      <button id="prev" class="navbtn" data-i18n-title="chrome.prevSlide" data-i18n-aria="chrome.prevSlide" title="Previous slide" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div id="nd" data-i18n-aria="chrome.slideNav"></div>
      <button id="next" class="navbtn" data-i18n-title="chrome.nextSlide" data-i18n-aria="chrome.nextSlide" title="Next slide" aria-label="Next slide"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div id="optionsMenu" class="optionsMenu">
    <button id="menuBtn" class="menuBtn" type="button" data-i18n-title="chrome.moreOptions" data-i18n-aria="chrome.moreOptions" title="More options" aria-haspopup="true" aria-expanded="false" aria-label="More options">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
    <div id="menuList" class="menuList" role="menu" aria-hidden="true">
      <button type="button" class="menuItem" id="menuExportCurrent" role="menuitem">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 18h14"/></svg>
        <span data-i18n="chrome.exportCurrent">Export current</span>
      </button>
      <button type="button" class="menuItem" id="menuExportAll" role="menuitem">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 18h14"/><path d="M19 8V4H5v4"/></svg>
        <span data-i18n="chrome.exportAll">Export all</span>
      </button>
      <div class="menuSep" role="separator"></div>
      <button type="button" class="menuItem" id="menuFullscreen" role="menuitem">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>
        <span data-i18n="chrome.fullscreen">Fullscreen</span>
      </button>
    </div>
  </div>
</div>
<div id="drawerOverlay" class="drawerOverlay" aria-hidden="true"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawerHead"><button id="drawerBack" class="navBackBtn" type="button" data-i18n-aria="chrome.back" aria-label="Back" hidden><svg viewBox="0 0 24 24" width="15" height="15"><path d="M15 6l-6 6 6 6"/></svg></button><div><div id="drawerTitle" class="drawerTitle"></div><div id="drawerSub" class="drawerSub"></div></div><button id="drawerClose" class="xbtn" data-i18n-aria="chrome.close" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="drawerBody" class="drawerBody"></div>
</aside>
<div id="modal" class="modal" aria-hidden="true"><div class="modalCard"><div class="modalHead"><div><h3 id="modalTitle"></h3><div id="modalSub" class="sub"></div></div><div class="modalHeadActions"><button id="modalExport" class="exportBtn" type="button" hidden data-i18n-title="table.exportPdfTitle" data-i18n-aria="table.exportPdfTitle" title="Export the current table as PDF" aria-label="Export the current table as PDF"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M5 18h14"/></svg><span data-i18n="table.exportPdf">PDF</span></button><button id="modalClose" class="xbtn" data-i18n-aria="chrome.close" aria-label="Close"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div><div id="modalBody" class="modalBody"></div></div></div>
<!-- Hover tooltip for Strategy Mix donut / Deep Dive bars. position:fixed
     so it is not clipped by a scaled slide. -->
<div id="donutTip" class="donutTip"></div>
<div id="exportOverlay" class="exportOverlay" hidden aria-hidden="true">
  <div class="exportCard">
    <div class="exportSpin" aria-hidden="true"></div>
    <div id="exportProgressText">Exporting…</div>
  </div>
</div>
<script src="js/i18n/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/data.js"></script>
<script src="js/vendor/apexcharts.min.js"></script>
<script src="js/slide-data/07-strategy-mix.data.js"></script>
<script src="js/slide-data/08-manager-concentration.data.js"></script>
<script src="js/slide-data/10-strategy-deep-dive-narratives.data.js"></script>
<script src="js/slide-data/10-strategy-deep-dive.data.js"></script>
<script src="js/slide-data/09-market-sentiment.data.js"></script>
<script src="js/pages/section-divider.js"></script>
<script src="js/pages/01-cover.js"></script>
<script src="js/pages/02-about-tangible.js"></script>
<script src="js/pages/03-tangible-stats.js"></script>
<script src="js/pages/05-routes-to-liquidity.js"></script>
<script src="js/pages/06-key-considerations.js"></script>
<script src="js/pages/07-strategy-mix.js"></script>
<script src="js/pages/08-manager-concentration.js"></script>
<script src="js/pages/10-strategy-deep-dive.js"></script>
<script src="js/pages/09-market-sentiment.js"></script>
<script src="js/pages/12-discussion-points.js"></script>
<script src="js/pages/13-next-steps.js"></script>
<script src="js/pages/14-basis-of-preparation.js"></script>
<script src="js/pages/15-annexes-divider.js"></script>
<script src="js/pages/16-portfolio-holdings.js"></script>
<script src="js/pages/17-tangible-contact.js"></script>
<script src="js/pages/18-disclaimer.js"></script>
<script src="js/slide-data/02-about-tangible-logos.js"></script>
<script src="js/vendor/html2canvas.min.js"></script>
<script src="js/vendor/jspdf.umd.min.js"></script>
<script src="js/export-deck.js"></script>
<script src="js/app.js"></script>
</body>
</html>
